const PL = {1:"Must Do", 2:"Want To", 3:"Maybe"};
const PC = {1:"#10b981", 2:"#3b82f6", 3:"#f59e0b"};
const PB = {1:"rgba(16,185,129,0.10)", 2:"rgba(59,130,246,0.10)", 3:"rgba(245,158,11,0.10)"};
const MC = ["#10b981","#3b82f6","#f59e0b","#e879a0","#a78bfa","#fb923c"];

function fmtPrice(a) {
  if (a.pxpf === 0) return "FREE";
  if (a.pxpf) return xpf(a.pxpf) + " / " + a.pxpf.toLocaleString() + " XPF";
  if (a.pusd) return a.pusd;
  return "Contact resort";
}

function score(id, votes) {
  const ms = Object.keys(votes);
  if (!ms.length) return 999;
  const vs = ms.map(m => votes[m][id] || null).filter(Boolean);
  if (!vs.length) return 999;
  return vs.reduce((s,v)=>s+v,0)/vs.length - (vs.length/ms.length)*0.3;
}

async function apiGet() {
  const r = await fetch(SCRIPT_URL);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiPost(payload) {
  const r = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(payload) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

const FAMILY = ["Gabe","Meghan","Aria","Sonora"];

function NameSetup({ onSave, saving, selectedName, setSelectedName }) {
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0a1628,#0d2340 40%,#0a3a2a)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Georgia,Palatino,serif",padding:24}}>

        <div style={{fontSize:48,marginBottom:16}}>🌺</div>
        <div style={{fontSize:11,letterSpacing:6,color:"#94d4a8",textTransform:"uppercase",marginBottom:8}}>Moorea & Tahiti · Family Trip Planner</div>
        <h2 style={{fontSize:26,fontWeight:400,color:"#fef0c0",margin:"0 0 12px"}}>Who are you?</h2>
        <p style={{color:"#7db8a0",fontSize:14,marginBottom:32,lineHeight:1.6}}>Tap your name to get started.</p>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {FAMILY.map((n,i) => {
            const col = ["#10b981","#3b82f6","#f59e0b","#e879a0"][i];
            const selected = selectedName === n;
            return (
              <button key={n} onClick={() => setSelectedName(n)} style={{
                background: selected ? col+"28" : "rgba(255,255,255,0.05)",
                border: selected ? "2px solid "+col : "1px solid rgba(255,255,255,0.12)",
                borderRadius:12, padding:"16px 20px",
                fontSize:18, color: selected ? col : "#c8d8c8",
                cursor:"pointer", fontFamily:"Georgia,Palatino,serif",
                fontWeight: selected ? 600 : 400,
                transition:"all 0.15s",
                display:"flex", alignItems:"center", gap:12,
              }}>
                <span style={{width:10,height:10,borderRadius:"50%",background:col,display:"inline-block",flexShrink:0}}/>
                {n}
                {selected && <span style={{marginLeft:"auto",fontSize:14}}>✓</span>}
              </button>
            );
          })}
        </div>
        {selectedName && (
          <button onClick={() => onSave(selectedName)} disabled={saving} style={{
            width:"100%", marginTop:24,
            background:"rgba(148,212,168,0.2)", border:"1px solid rgba(148,212,168,0.5)",
            borderRadius:12, padding:"14px", fontSize:15, color:"#94d4a8",
            cursor: saving ? "wait" : "pointer", fontFamily:"inherit", opacity: saving ? 0.7 : 1,
          }}>

function App() {
  const [myName, setMyName] = useState(() => { try { return lsGet(MY_NAME_KEY)||""; } catch { return ""; } });
  const [allVotes, setAllVotes] = useState({});
  const [loadState, setLoadState] = useState("loading");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [joining, setJoining] = useState(false);
  const [selectedName, setSelectedName] = useState("");
  const [cat, setCat] = useState("All");
  const [sortBy, setSortBy] = useState("category");
  const [selOnly, setSelOnly] = useState(false);
  const [pFilter, setPFilter] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const saveTimer = useRef(null);
  const pollTimer = useRef(null);

  const loadVotes = async () => {
    try { const d = await apiGet(); setAllVotes(d||{}); setLoadState("ready"); }
    catch { setLoadState(s => s==="loading" ? "error" : s); }
  };

  useEffect(() => {
    loadVotes();
    pollTimer.current = setInterval(loadVotes, 15000);
    return () => clearInterval(pollTimer.current);
  }, []);

  const saveName = async (name) => {
    setJoining(true);
    try {
      const d = await apiPost({ action:"setName", name });
      setAllVotes(d||{});
      lsSet(MY_NAME_KEY, name);
      setMyName(name);
    } catch { alert("Could not connect. Check your internet connection and try again."); }
    finally { setJoining(false); }
  };

  const setPriority = (aid, p) => {
    if (!myName) return;
    const mv = allVotes[myName]||{};
    const nmv = {...mv, [aid]: mv[aid]===p ? null : p};
    const nav = {...allVotes, [myName]: nmv};
    setAllVotes(nav);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(async () => {
      try { const d = await apiPost({action:"setVotes",name:myName,votes:nmv}); setAllVotes(d||nav); setSaveStatus("saved"); setTimeout(()=>setSaveStatus("idle"),2000); }
      catch { setSaveStatus("error"); }
    }, 600);
  };

  const members = Object.keys(allVotes);
  const mcMap = members.reduce((a,m,i)=>{a[m]=MC[i%MC.length];return a;},{});
  const mv = myName ? (allVotes[myName]||{}) : {};

  const acts = ACTIVITIES.map(a => ({
    ...a,
    myP: mv[a.id]||null,
    votes: members.reduce((acc,m)=>{const v=allVotes[m][a.id]||null;if(v)acc[m]=v;return acc;},{}),
    sc: score(a.id, allVotes),
  }));

  const pc = {1:0,2:0,3:0};
  acts.forEach(a => { if(a.myP) pc[a.myP]++; });

  const filtered = acts.filter(a => {
    if (cat!=="All" && a.cat!==cat) return false;
    if (selOnly && !a.myP) return false;
    if (pFilter!==null && a.myP!==pFilter) return false;
    return true;
  });

  const sorted = [...filtered].sort((a,b) => {
    if (sortBy==="priority") return (a.myP||99)-(b.myP||99);
    if (sortBy==="consensus") return a.sc-b.sc;
    if (sortBy==="price") return (a.pxpf||999999)-(b.pxpf||999999);
    return a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name);
  });

  const togglePF = p => { setPFilter(pv=>pv===p?null:p); if(selOnly) setSelOnly(false); };
  const toggleSel = () => { setSelOnly(s=>!s); if(!selOnly) setPFilter(null); };

  if (loadState==="loading") return (
    <div style={{minHeight:"100vh",background:"#0a1628",display:"flex",alignItems:"center",justifyContent:"center",color:"#94d4a8",fontFamily:"Georgia,serif",fontSize:14,gap:10}}>
      <span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>🌀</span> Loading family votes...
    </div>
  );
  if (loadState==="error") return (
    <div style={{minHeight:"100vh",background:"#0a1628",display:"flex",alignItems:"center",justifyContent:"center",color:"#f87171",fontFamily:"Georgia,serif",fontSize:14,flexDirection:"column",gap:12,padding:24,textAlign:"center"}}>
      <div style={{fontSize:32}}>⚠️</div>
      <div>Could not reach the backend.</div>
      <div style={{color:"#5a8870",fontSize:12}}>Check your internet connection.</div>
      <button onClick={loadVotes} style={{marginTop:8,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"8px 20px",color:"#94d4a8",cursor:"pointer",fontFamily:"inherit"}}>Retry</button>
    </div>
  );
  if (!myName) return <NameSetup onSave={saveName} saving={joining} selectedName={selectedName} setSelectedName={setSelectedName}/>;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0a1628,#0d2340 40%,#0a3a2a)",fontFamily:"Georgia,Palatino,serif",color:"#e8dcc8",paddingBottom:60}}>

      {/* Header */}
      <div style={{background:"linear-gradient(180deg,rgba(0,80,60,0.6),transparent)",padding:"28px 20px 22px",textAlign:"center",borderBottom:"1px solid rgba(255,200,100,0.15)"}}>
        <div style={{fontSize:11,letterSpacing:6,color:"#94d4a8",textTransform:"uppercase",marginBottom:5}}>Family Trip Planner</div>
        <h1 style={{fontSize:"clamp(22px,5vw,38px)",fontWeight:400,margin:"0 0 4px",color:"#fef0c0"}}>Moorea & Tahiti</h1>
        <div style={{color:"#7db8a0",fontSize:13,marginBottom:14}}>June 13–18, 2026 · Manava Beach Resort</div>

        {/* Member dots */}
        <div style={{display:"flex",gap:7,justifyContent:"center",flexWrap:"wrap",marginBottom:12}}>
          {members.map(m=>(
            <div key={m} style={{display:"flex",alignItems:"center",gap:5,background:m===myName?`${mcMap[m]}22`:"rgba(255,255,255,0.05)",border:`1px solid ${m===myName?mcMap[m]:"rgba(255,255,255,0.1)"}`,borderRadius:20,padding:"4px 11px",fontSize:11.5,color:m===myName?mcMap[m]:"#7a9988"}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:mcMap[m],display:"inline-block"}}/>
              {m}{m===myName?" (you)":""}
            </div>
          ))}
          <button onClick={()=>{try{lsRemove(MY_NAME_KEY);}catch{}setMyName("");}}
            style={{background:"transparent",border:"1px solid rgba(255,255,255,0.08)",borderRadius:20,padding:"4px 11px",fontSize:11,color:"#3a5848",cursor:"pointer",fontFamily:"inherit"}}>Switch</button>
        </div>

        {/* Priority pills */}
        <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
          {[1,2,3].map(p=>{
            const on=pFilter===p;
            return <button key={p} onClick={()=>togglePF(p)} style={{background:on?PB[p]:`${PC[p]}14`,border:on?`2px solid ${PC[p]}`:`1px solid ${PC[p]}44`,borderRadius:20,padding:on?"5px 14px":"6px 15px",fontSize:12,color:on?PC[p]:`${PC[p]}bb`,cursor:"pointer",fontFamily:"inherit",boxShadow:on?`0 0 10px ${PC[p]}30`:"none"}}>
              {PL[p]}: {pc[p]}{on?" ✕":""}
            </button>;
          })}
        </div>

        <div style={{height:16,marginTop:5,fontSize:11,color:saveStatus==="error"?"#f87171":saveStatus==="saved"?"#10b981":"#3a5848",transition:"color 0.3s"}}>
          {saveStatus==="saving"&&"Saving..."}{saveStatus==="saved"&&"✓ Saved to Drive"}{saveStatus==="error"&&"⚠ Save failed"}
        </div>
      </div>

      {/* Controls */}
      <div style={{padding:"12px 14px 0",maxWidth:960,margin:"0 auto"}}>
        {/* Category scroll */}
        <div style={{overflowX:"auto",paddingBottom:7,marginBottom:9}}>
          <div style={{display:"flex",gap:6,minWidth:"max-content"}}>
            {CATEGORIES.map(c=>(
              <button key={c} onClick={()=>setCat(c)} style={{background:cat===c?"rgba(148,212,168,0.2)":"rgba(255,255,255,0.05)",border:cat===c?"1px solid #94d4a8":"1px solid rgba(255,255,255,0.1)",borderRadius:20,padding:"5px 12px",fontSize:11.5,color:cat===c?"#94d4a8":"#9aada0",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}>{c}</button>
            ))}
          </div>
        </div>

        {/* Sort row */}
        <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
          <span style={{fontSize:10.5,color:"#6b9980",letterSpacing:2,textTransform:"uppercase"}}>Sort:</span>
          {[["category","Category"],["priority","My Priority"],["consensus","Family"],["price","Price"]].map(([v,l])=>(
            <button key={v} onClick={()=>setSortBy(v)} style={{background:sortBy===v?"rgba(250,200,80,0.15)":"transparent",border:sortBy===v?"1px solid rgba(250,200,80,0.4)":"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"4px 10px",fontSize:11,color:sortBy===v?"#fac850":"#7a9988",cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
          ))}
          <button onClick={toggleSel} style={{background:selOnly?"rgba(148,212,168,0.15)":"transparent",border:selOnly?"1px solid rgba(148,212,168,0.5)":"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"4px 10px",fontSize:11,color:selOnly?"#94d4a8":"#7a9988",cursor:"pointer",fontFamily:"inherit"}}>
            {selOnly?"✓ My Picks":"My Picks"}
          </button>
          <span style={{marginLeft:"auto",fontSize:11,color:"#3a5848"}}>{sorted.length}/{ACTIVITIES.length}</span>
        </div>

        {/* Cards */}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {sorted.length===0 && <div style={{textAlign:"center",color:"#4a6858",padding:"40px 0",fontSize:14}}>No activities match the current filters.</div>}
          {sorted.map(a => {
            const ve = Object.entries(a.votes);
            const isOpen = expanded===a.id;
            return (
              <div key={a.id} style={{background:a.myP?PB[a.myP]:"rgba(255,255,255,0.03)",border:a.myP===1?"1px solid rgba(16,185,129,0.4)":a.myP===2?"1px solid rgba(59,130,246,0.35)":a.myP===3?"1px solid rgba(245,158,11,0.3)":"1px solid rgba(255,255,255,0.07)",borderRadius:12,overflow:"hidden"}}>
                <div onClick={()=>setExpanded(isOpen?null:a.id)} style={{padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"flex-start",gap:10}}>
                  <div style={{width:4,minHeight:36,borderRadius:2,flexShrink:0,marginTop:2,background:a.myP?PC[a.myP]:"rgba(255,255,255,0.08)"}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:7,flexWrap:"wrap"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:14,color:"#f0e6cc",fontWeight:600}}>{a.name}</span>
                        {a.myP && <span style={{fontSize:10,fontWeight:700,color:PC[a.myP],background:`${PC[a.myP]}22`,border:`1px solid ${PC[a.myP]}55`,borderRadius:4,padding:"2px 7px",textTransform:"uppercase"}}>{PL[a.myP]}</span>}
                        {a.flag && <span style={{fontSize:10.5,color:"#f0c060",background:"rgba(240,192,96,0.1)",borderRadius:4,padding:"2px 7px"}}>{a.flag}</span>}
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:13,color:"#7de8b0",fontWeight:600}}>{fmtPrice(a)}</div>
                        {a.pnote && <div style={{fontSize:10,color:"#5a8870"}}>{a.pnote}</div>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:6,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{fontSize:10.5,color:"#6b9c84"}}>{a.cat}</span>
                      <span style={{fontSize:10.5,color:"#3a5848"}}>·</span>
                      <span style={{fontSize:10.5,color:"#6b9c84"}}>⏱ {a.dur}</span>
                      {!a.kids && <span style={{fontSize:10.5,color:"#f0a060"}}>⚠️ Age check</span>}
                      {ve.length>0 && (
                        <div style={{display:"flex",gap:3,marginLeft:2}}>
                          {ve.map(([n,p])=>(
                            <span key={n} title={n+": "+PL[p]} style={{fontSize:10,borderRadius:10,padding:"1px 7px",background:`${mcMap[n]||"#94d4a8"}20`,border:`1px solid ${mcMap[n]||"#94d4a8"}50`,color:mcMap[n]||"#94d4a8"}}>
                              {n.split(" ")[0]} {p===1?"✓✓":p===2?"✓":"~"}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  <div style={{fontSize:14,color:"#3a5848",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",flexShrink:0,marginTop:2}}>▾</div>
                </div>

                {isOpen && (
                  <div style={{padding:"0 14px 14px 32px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                    <p style={{fontSize:13,color:"#b8c8b8",margin:"11px 0 9px",lineHeight:1.6}}>{a.desc}</p>
                    {a.knote && <div style={{background:"rgba(240,160,96,0.1)",border:"1px solid rgba(240,160,96,0.2)",borderRadius:6,padding:"7px 11px",marginBottom:9,fontSize:12,color:"#f0b060"}}>👨‍👧 Kids: {a.knote}</div>}
                    <div style={{fontSize:12,color:"#5a8870",marginBottom:10}}>📍 {a.where} · 📋 {a.book}</div>

                    {members.length>1 && (
                      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
                        {members.map(m=>{
                          const v=allVotes[m]?.[a.id]||null;
                          return <div key={m} style={{fontSize:11,borderRadius:6,padding:"3px 9px",background:v?`${mcMap[m]}18`:"rgba(255,255,255,0.03)",border:`1px solid ${v?mcMap[m]+"55":"rgba(255,255,255,0.07)"}`,color:v?mcMap[m]:"#3a5848"}}>{m}: {v?PL[v]:"–"}</div>;
                        })}
                      </div>
                    )}

                    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{fontSize:11,color:"#3a5848"}}>My vote:</span>
                      {[1,2,3].map(p=>(
                        <button key={p} onClick={e=>{e.stopPropagation();setPriority(a.id,p);}}
                          style={{background:a.myP===p?`${PC[p]}30`:"transparent",border:`1px solid ${a.myP===p?PC[p]:"rgba(255,255,255,0.1)"}`,borderRadius:6,padding:"5px 12px",fontSize:12,color:a.myP===p?PC[p]:"#6a8878",cursor:"pointer",fontFamily:"inherit"}}>
                          {a.myP===p?"✓ ":""}{PL[p]}
                        </button>
                      ))}
                      {a.myP && <button onClick={e=>{e.stopPropagation();setPriority(a.id,a.myP);}} style={{background:"transparent",border:"1px solid rgba(255,255,255,0.07)",borderRadius:6,padding:"5px 9px",fontSize:11,color:"#3a5848",cursor:"pointer",fontFamily:"inherit"}}>Clear</button>}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{maxWidth:960,margin:"24px auto 0",padding:"0 14px",textAlign:"center",fontSize:11,color:"#2a4838",lineHeight:1.8}}>
        XPF at ~$1 = 119 XPF · Resort desk: +689 40 55 17 97 · activites@manavamoorearesort.pf<br/>
        Cancellation: 48hr notice for full refund (standard) · 5 days for private tours
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
